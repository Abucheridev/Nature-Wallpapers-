<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2a24">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Wild Walls</title>
<style>
:root{--bg:#1c2a24;--ink:#eef1e6;--mute:#a3b0a5;--line:#34473d;--accent:#e9a23b}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom))}
header{padding:24px 2px 12px}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
header p{color:var(--mute);margin-top:8px;font-size:15px}
.tabs{display:flex;background:#25362e;border-radius:14px;padding:4px;margin:6px 0 12px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:11px;border-radius:11px;font:inherit;font-weight:700;font-size:15px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;color:var(--ink);padding:9px 15px;border-radius:99px;font:inherit;font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);color:#2a2008;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{border:0;padding:0;background:var(--line);border-radius:18px;overflow:hidden;aspect-ratio:9/19.5;position:relative;cursor:pointer}
.tile canvas,.tile img{width:100%;height:100%;display:block;object-fit:cover}
.tile span{position:absolute;left:10px;bottom:9px;right:10px;text-align:left;font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.empty{grid-column:1/-1;color:var(--mute);line-height:1.5;font-size:15px;padding:8px 2px}
.empty b{color:var(--ink)}
.view{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.view.open{display:flex}
.stage{flex:1;min-height:0;display:flex;justify-content:center}
.stage canvas,.stage img{height:100%;max-width:100%;aspect-ratio:9/19.5;border-radius:22px;object-fit:cover}
.bar{display:flex;gap:10px;padding-top:12px}
.bar button{flex:1;padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:600;font-size:15px}
.bar .main{background:var(--accent);color:#2a2008;border-color:var(--accent)}
.msg a{color:var(--accent)}
.msg{text-align:center;color:var(--mute);font-size:13px;min-height:18px;padding-top:8px}
[hidden]{display:none!important}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>Wild Walls</h1>
  <p>Nature wallpapers for your phone. Pick one and save it.</p>
</header>
<div class="tabs" role="tablist">
  <button role="tab" id="tabArt" aria-selected="true">Art</button>
  <button role="tab" id="tabPhotos" aria-selected="false">Photos</button>
  <button role="tab" id="tabLive" aria-selected="false">Live</button>
</div>
<div class="chips" id="chips"></div>
<main class="grid" id="grid"></main>

<section class="view" id="view" aria-label="Preview">
  <div class="stage"><canvas id="big"></canvas><img id="bigImg" alt="" hidden></div>
  <div class="msg" id="msg"></div>
  <div class="bar">
    <button id="close">Back</button>
    <button id="alt">Shuffle</button>
    <button id="save" class="main">Save</button>
  </div>
</section>

<script>
/* ---------- helpers ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex(h){return[1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
function mix(a,b,t){const A=hex(a),B=hex(b);return"rgb("+A.map((v,i)=>Math.round(v*(1-t)+B[i]*t)).join()+")"}
function sky(c,w,h,p,hor){const g=c.createLinearGradient(0,0,0,h*hor);g.addColorStop(0,p[0]);g.addColorStop(.6,p[1]);g.addColorStop(1,p[2]);c.fillStyle=g;c.fillRect(0,0,w,h)}
function glowAt(c,x,y,R,col){const g=c.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,col);g.addColorStop(1,"rgba(255,255,255,0)");c.fillStyle=g;c.beginPath();c.arc(x,y,R,0,7);c.fill()}

/* ---------- drawn art ---------- */
function acacia(c,x,y,s,col){c.fillStyle=col;c.strokeStyle=col;c.lineWidth=s*.07;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+s*.05,y-s*.5,x-s*.04,y-s*.95);c.stroke();
 c.beginPath();c.ellipse(x-s*.04,y-s*1.0,s*.75,s*.14,0,0,7);c.fill();c.beginPath();c.ellipse(x+s*.2,y-s*1.13,s*.5,s*.11,0,0,7);c.fill()}
function giraffe(c,x,y,s,flip,col){c.save();c.translate(x,y);c.scale(flip?-1:1,1);c.fillStyle=col;c.strokeStyle=col;c.lineCap="round";
 c.beginPath();c.ellipse(0,-s*.85,s*.34,s*.17,-.1,0,7);c.fill();
 c.lineWidth=s*.05;[[-.22,.2],[-.12,.25],[.14,.25],[.24,.2]].forEach(l=>{c.beginPath();c.moveTo(s*l[0],-s*.78);c.lineTo(s*l[0]*1.05,0);c.stroke()});
 c.lineWidth=s*.11;c.beginPath();c.moveTo(s*.24,-s*.92);c.lineTo(s*.42,-s*1.75);c.stroke();
 c.beginPath();c.ellipse(s*.47,-s*1.82,s*.11,s*.06,-.5,0,7);c.fill();
 c.lineWidth=s*.02;c.beginPath();c.moveTo(s*.42,-s*1.86);c.lineTo(s*.4,-s*1.95);c.moveTo(s*.47,-s*1.88);c.lineTo(s*.47,-s*1.97);c.stroke();
 c.lineWidth=s*.02;c.beginPath();c.moveTo(-s*.33,-s*.88);c.quadraticCurveTo(-s*.42,-s*.75,-s*.4,-s*.6);c.stroke();c.restore()}
function savanna(c,w,h,p,r){const hor=.64;sky(c,w,h,p,hor);const sx=w*(.25+r()*.5);glowAt(c,sx,h*hor,w*.7,p[2]);
 c.fillStyle=p[2];c.beginPath();c.arc(sx,h*hor-w*.02,w*.11,0,7);c.fill();
 c.fillStyle=mix(p[2],p[3],.55);c.beginPath();c.moveTo(0,h*hor);for(let x=0;x<=w;x+=w/30)c.lineTo(x,h*hor-Math.sin(x/w*5+r()*.4)*h*.012-h*.012);c.lineTo(w,h);c.lineTo(0,h);c.fill();
 c.fillStyle=p[3];c.fillRect(0,h*hor+h*.004,w,h);
 acacia(c,w*(.1+r()*.15),h*hor+h*.01,w*.34,p[3]);acacia(c,w*(.7+r()*.2),h*hor+h*.03,w*.24,p[3]);
 giraffe(c,w*(.32+r()*.1),h*(hor+.13),w*.34,false,p[3]);giraffe(c,w*(.68+r()*.1),h*(hor+.2),w*.24,true,p[3])}
function forest(c,w,h,p,r){sky(c,w,h,[p[0],p[1],p[2]],.55);glowAt(c,w*(.3+r()*.4),h*.28,w*.5,p[2]);
 for(let i=0;i<6;i++){const base=h*(.42+i*.1),pw=w*(.09-i*.004),hh=h*(.05+i*.012);
  c.fillStyle=mix(p[2],p[3],i/5);c.beginPath();c.moveTo(0,h);c.lineTo(0,base);
  for(let x=-pw;x<w+pw;x+=pw){const t=hh*(.6+r()*.8);c.lineTo(x+pw/2,base-t);c.lineTo(x+pw,base)}
  c.lineTo(w,h);c.fill();
  if(i<5){const g=c.createLinearGradient(0,base-hh,0,base+h*.08);g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(1,p[2]);c.globalAlpha=.22;c.fillStyle=g;c.fillRect(0,base-hh,w,hh+h*.08);c.globalAlpha=1}}}
function ocean(c,w,h,p,r){const hor=.5;sky(c,w,h,p,hor);const sx=w*(.3+r()*.4);glowAt(c,sx,h*hor,w*.6,p[3]);
 c.fillStyle=p[3];c.beginPath();c.arc(sx,h*hor-w*.1,w*.09,0,7);c.fill();
 const g=c.createLinearGradient(0,h*hor,0,h);g.addColorStop(0,p[1]);g.addColorStop(1,p[0]);c.fillStyle=g;c.fillRect(0,h*hor,w,h);
 for(let k=0;k<16;k++){c.globalAlpha=.5*(1-k/16);c.fillStyle=p[3];const ww=w*.2*(1-k/20)*(.7+r()*.6);c.fillRect(sx-ww/2,h*hor+k*h*.022,ww,h*.007)}
 c.globalAlpha=1;for(let i=0;i<7;i++){const y=h*(.58+i*.06),a=h*(.008+i*.004),f=1.5+r()*2,ph=r()*6;c.globalAlpha=.35;c.fillStyle=mix(p[1],p[2],i/6);c.beginPath();c.moveTo(0,h);
  for(let x=0;x<=w;x+=w/50)c.lineTo(x,y+Math.sin(x/w*f*6.28+ph)*a);c.lineTo(w,h);c.fill()}c.globalAlpha=1}
function night(c,w,h,p,r){const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,p[0]);g.addColorStop(1,p[1]);c.fillStyle=g;c.fillRect(0,0,w,h);
 for(let i=0;i<160;i++){c.globalAlpha=.25+r()*.75;c.fillStyle=p[2];c.beginPath();c.arc(r()*w,r()*h*.65,w*(.002+r()*.003),0,7);c.fill()}c.globalAlpha=1;
 const mx=w*(.25+r()*.5),my=h*(.17+r()*.1);glowAt(c,mx,my,w*.35,p[2]);c.fillStyle=p[2];c.beginPath();c.arc(mx,my,w*.09,0,7);c.fill();
 for(let i=0;i<3;i++){const y0=h*(.66+i*.1),a=h*(.05+r()*.03),f=1+r()*1.5,ph=r()*6;c.fillStyle=mix(p[1],p[3],(i+1)/3);c.beginPath();c.moveTo(0,h);
  for(let x=0;x<=w;x+=w/70)c.lineTo(x,y0-Math.abs(Math.sin(x/w*f*6.28+ph))*a-Math.sin(x/w*13+ph)*a*.15);c.lineTo(w,h);c.fill()}}
const STYLES={
 Savanna:{fn:savanna,pals:[["#2b1740","#c0455a","#ffb347","#1a0f1f"],["#12243a","#e0704a","#ffd98a","#201418"],["#3a1c4a","#d9577e","#ffc4a0","#241225"],["#1c2b45","#e8895b","#fff0b8","#1b1217"]]},
 Forest:{fn:forest,pals:[["#2c4a52","#6f9a8d","#cfe3d4","#0f2a1f"],["#3a3552","#8a7fa8","#e6d9f0","#17202a"],["#4a3a2a","#c99a62","#f6e2b8","#14261b"],["#1d3a3a","#4f8c80","#bfe8d8","#0b1f1a"]]},
 Ocean:{fn:ocean,pals:[["#0b2545","#13678a","#8fd3e0","#f6e7b4"],["#3a1c54","#c4527a","#ffa38b","#ffe9a8"],["#0e3b43","#2a9d8f","#c8f0e0","#fff4c9"],["#1a1a40","#3f5ea8","#9bb8f0","#f2f0ff"]]},
 Night:{fn:night,pals:[["#07102b","#1d2f6b","#f4f1de","#0a1224"],["#12082e","#4a2c7a","#fff3d6","#0c0820"],["#04161c","#0f4c5c","#e3f6f5","#06131a"],["#1a0b2e","#7a2e6e","#ffe4ef","#10081c"]]}
};
function renderArt(cv,w,h,it){cv.width=w;cv.height=h;const c=cv.getContext("2d");STYLES[it.s].fn(c,w,h,STYLES[it.s].pals[it.p],rng(it.seed))}

/* ---------- live photos ---------- */
// Optional: paste a free Unsplash Access Key between the quotes for Unsplash photos.
// Leave it empty to use Wikimedia Commons (no key needed).
const UNSPLASH_KEY="";
const LIVE={Wildlife:"wildlife animal",Birds:"bird",Ocean:"ocean sea",Forest:"forest",Mountains:"mountain",Flowers:"flower",Sky:"sunset sky"};
const liveCache={};
const plain=h=>new DOMParser().parseFromString(h||"","text/html").body.textContent.trim();
async function fetchLive(cat){return UNSPLASH_KEY?unsplash(cat):commons(cat)}
async function unsplash(cat){
 const u="https://api.unsplash.com/search/photos?query="+encodeURIComponent(LIVE[cat]+" nature")+"&orientation=portrait&per_page=24&page="+(1+Math.floor(Math.random()*4))+"&client_id="+UNSPLASH_KEY;
 const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json();
 return j.results.map(x=>({kind:"live",prov:"unsplash",id:x.id,thumb:x.urls.small,prev:x.urls.regular,raw:x.urls.raw,
  dl:x.links.download_location+"&client_id="+UNSPLASH_KEY,name:x.user.name,userUrl:x.user.links.html+"?utm_source=wild_walls&utm_medium=referral"}))}
async function commons(cat){
 async function go(off){const q=LIVE[cat]+' filetype:bitmap incategory:"Featured pictures on Wikimedia Commons"';
  const u="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=30&gsroffset="+off+"&gsrsearch="+encodeURIComponent(q)+"&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=960&iiextmetadatafilter=Artist|LicenseShortName";
  const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json();return j.query?Object.values(j.query.pages):[]}
 let pages=await go(Math.floor(Math.random()*40));if(!pages.length)pages=await go(0);
 return pages.filter(p=>{const i=p.imageinfo&&p.imageinfo[0];return i&&i.width>=1400&&i.height>=1200&&/\.(jpe?g|png)$/i.test(p.title)})
  .sort((a,b)=>b.imageinfo[0].height/b.imageinfo[0].width-a.imageinfo[0].height/a.imageinfo[0].width)
  .map(p=>{const i=p.imageinfo[0],m=i.extmetadata||{};return{kind:"live",prov:"commons",id:p.title.replace(/^File:/,"").replace(/\.[^.]+$/,"").replace(/[^a-z0-9]+/gi,"-").slice(0,40),
   thumb:i.thumburl.replace(/\/\d+px-([^/]*)$/,"/500px-$1"),prev:i.thumburl,iw:i.width,ih:i.height,page:i.descriptionurl,
   artist:plain(m.Artist&&m.Artist.value),license:plain(m.LicenseShortName&&m.LicenseShortName.value)}})}
function link(t,h){const a=document.createElement("a");a.href=h;a.target="_blank";a.rel="noopener";a.textContent=t;return a}
function setCredit(it){msg.textContent="";
 if(it.prov==="unsplash"){msg.append("Photo by ",link(it.name,it.userUrl)," on ",link("Unsplash","https://unsplash.com/?utm_source=wild_walls&utm_medium=referral"))}
 else{msg.append((it.artist?it.artist.slice(0,60)+" · ":"")+(it.license?it.license+" · ":""),link("Source",it.page))}}
function loadImg(u){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>res(i);i.onerror=rej;i.src=u})}
function chipBtn(t,on,fn){const b=document.createElement("button");b.className="chip";b.textContent=t;b.setAttribute("aria-pressed",on);b.onclick=fn;chips.appendChild(b)}
function note(t){grid.innerHTML="";const d=document.createElement("div");d.className="empty";d.textContent=t;grid.appendChild(d)}
async function drawLive(){chips.innerHTML="";Object.keys(LIVE).forEach(c=>chipBtn(c,filter===c,()=>{filter=c;draw()}));
 chipBtn("Refresh",false,()=>{liveCache[filter]=null;draw()});
 const cat=filter;
 if(!liveCache[cat]){note("Loading photos…");try{liveCache[cat]=await fetchLive(cat)}catch(e){if(tab==="live"&&filter===cat)note("Couldn't load photos. Check your connection, or try again in a few minutes.");return}}
 if(tab!=="live"||filter!==cat)return;grid.innerHTML="";
 if(!liveCache[cat].length){note("No photos found. Tap Refresh to try again.");return}
 liveCache[cat].forEach(it=>{const b=tile(cat+" photo");const im=document.createElement("img");im.loading="lazy";im.alt="";im.onerror=()=>{im.onerror=null;im.src=it.prev};im.src=it.thumb;b.append(im);b.onclick=()=>openIt(it);grid.appendChild(b)})}
async function saveLive(){msg.textContent="Preparing…";
 try{const d=devicePixelRatio||2,W=Math.min(Math.round(screen.width*d),1440)||1080,H=Math.min(Math.round(screen.height*d),3200)||2400;let blob;
  if(cur.prov==="unsplash"){fetch(cur.dl).catch(()=>{});const r=await fetch(cur.raw+(cur.raw.includes("?")?"&":"?")+"w="+W+"&h="+H+"&fit=crop&crop=entropy&q=85&fm=jpg");blob=await r.blob()}
  else{const need=Math.ceil(Math.max(W,H*cur.iw/cur.ih)),ok=[960,1280,1920,3840].filter(z=>z<=cur.iw),tw=ok.find(z=>z>=need)||ok[ok.length-1];const img=await loadImg(cur.prev.replace(/\/\d+px-([^/]*)$/,"/"+tw+"px-$1"));
   const cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d"),k=Math.max(W/img.width,H/img.height);
   c.drawImage(img,(W-img.width*k)/2,(H-img.height*k)/2,img.width*k,img.height*k);blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.92))}
  await deliver(blob,"wild-"+cur.id+".jpg");setCredit(cur)}catch(e){msg.textContent="Could not save. Check your connection and try again."}}

/* ---------- state ---------- */
const art=[];let n=1;for(const s in STYLES)STYLES[s].pals.forEach((_,p)=>art.push({kind:"art",s,p,seed:n++*7919,label:s}));
let photos=[],tab="art",filter="All",cur=null,favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("favs")||"[]"))}catch(e){}
function saveFavs(){try{localStorage.setItem("favs",JSON.stringify([...favs]))}catch(e){}}
const $=id=>document.getElementById(id),chips=$("chips"),grid=$("grid"),view=$("view"),big=$("big"),bigImg=$("bigImg"),msg=$("msg");

/* ---------- photos from the GitHub repo ---------- */
async function loadPhotos(){
 const host=location.hostname,owner=host.endsWith("github.io")?host.split(".")[0]:null,repo=location.pathname.split("/")[1];
 let list=null;
 if(owner&&repo){try{list=[];for(const dir of ["","images"]){const r=await fetch("https://api.github.com/repos/"+owner+"/"+repo+"/contents/"+dir);if(!r.ok){if(dir==="")throw 0;continue}
   (await r.json()).forEach(f=>{if(f.type==="file"&&/\.(jpe?g|png|webp)$/i.test(f.name)&&!/^icon/i.test(f.name))list.push({src:(dir?dir+"/":"")+encodeURIComponent(f.name),name:f.name})})}
  try{localStorage.setItem("photos-v1",JSON.stringify(list))}catch(e){}}catch(e){list=null}}
 if(!list){try{list=JSON.parse(localStorage.getItem("photos-v1")||"[]")}catch(e){list=[]}}
 photos=list.map(f=>{const base=decodeURIComponent(f.name).replace(/\.[^.]+$/,""),parts=base.split(/[-_ ]+/).filter(Boolean),cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  return{kind:"photo",src:f.src,cat:cap(parts[0]||"Photos"),label:parts.length>1?parts.slice(1).map(cap).join(" "):cap(parts[0]||"Photo"),file:decodeURIComponent(f.name)}})}

/* ---------- gallery ---------- */
function setChips(names){chips.innerHTML="";names.forEach(f=>{const b=document.createElement("button");b.className="chip";b.textContent=f;b.setAttribute("aria-pressed",f===filter);
 b.onclick=()=>{filter=f;draw()};chips.appendChild(b)})}
function draw(){grid.innerHTML="";
 if(tab==="art"){setChips(["All",...Object.keys(STYLES)]);
  art.filter(i=>filter==="All"||i.s===filter).forEach(it=>{const b=tile(it.label+" wallpaper");const cv=document.createElement("canvas");renderArt(cv,216,468,it);b.append(cv,cap(it.label));b.onclick=()=>openIt(it);grid.appendChild(b)})}
 else if(tab==="photos"){const cats=[...new Set(photos.map(p=>p.cat))].sort();if(favs.size)cats.unshift("Favorites");
  if(filter!=="All"&&filter!=="Favorites"&&!cats.includes(filter))filter="All";if(filter==="Favorites"&&!favs.size)filter="All";
  setChips(["All",...cats]);
  if(!photos.length){const d=document.createElement("div");d.className="empty";d.innerHTML="<b>No photos yet.</b><br>Upload photos to this GitHub repo and name them like <b>wildlife-lion.jpg</b> or <b>ocean-blue-wave.jpg</b>. The word before the first dash becomes the category. Then reopen the app.";grid.appendChild(d);return}
  photos.filter(p=>filter==="All"||(filter==="Favorites"?favs.has(p.src):p.cat===filter)).forEach(it=>{const b=tile(it.label);const im=document.createElement("img");im.loading="lazy";im.alt=it.label;im.src=it.src;b.append(im,cap(it.label));b.onclick=()=>openIt(it);grid.appendChild(b)})}
 else{drawLive()}}
function tile(label){const b=document.createElement("button");b.className="tile";b.setAttribute("aria-label",label);return b}
function cap(t){const s=document.createElement("span");s.textContent=t;return s}
function setTab(t){tab=t;filter="All";$("tabArt").setAttribute("aria-selected",t==="art");$("tabPhotos").setAttribute("aria-selected",t==="photos");$("tabLive").setAttribute("aria-selected",t==="live");if(t==="live")filter="Wildlife";draw()}
$("tabArt").onclick=()=>setTab("art");$("tabPhotos").onclick=()=>setTab("photos");$("tabLive").onclick=()=>setTab("live");

/* ---------- preview + save ---------- */
function openIt(it){cur=it;msg.textContent="";const a=$("alt");
 if(it.kind==="live"){big.hidden=true;bigImg.hidden=false;bigImg.src=it.prev;bigImg.alt="";a.hidden=true;setCredit(it)}
 else if(it.kind==="art"){a.hidden=false;big.hidden=false;bigImg.hidden=true;renderArt(big,540,1170,it);a.textContent="Shuffle"}
 else{a.hidden=false;big.hidden=true;bigImg.hidden=false;bigImg.src=it.src;bigImg.alt=it.label;a.textContent=favs.has(it.src)?"Unfavorite":"Favorite"}
 view.classList.add("open")}
$("close").onclick=()=>{view.classList.remove("open");if(tab==="photos")draw()};
$("alt").onclick=()=>{if(cur.kind==="art"){cur.seed=Math.floor(Math.random()*1e9);renderArt(big,540,1170,cur);draw()}
 else{favs.has(cur.src)?favs.delete(cur.src):favs.add(cur.src);saveFavs();$("alt").textContent=favs.has(cur.src)?"Unfavorite":"Favorite"}};
async function deliver(blob,name){const file=new File([blob],name,{type:blob.type||"image/png"});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});msg.textContent="Choose Gallery or Photos to keep it.";return}}catch(e){if(e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();msg.textContent="Saved to Downloads. Open it in Photos and set as wallpaper."}
$("save").onclick=async()=>{
 if(cur.kind==="live")return saveLive();
 if(cur.kind==="art"){const d=devicePixelRatio||2,W=Math.min(Math.round(screen.width*d),1440)||1080,H=Math.min(Math.round(screen.height*d),3200)||2400;
  const cv=document.createElement("canvas");renderArt(cv,W,H,cur);cv.toBlob(b=>deliver(b,("wild-"+cur.label+"-"+cur.p).toLowerCase()+".png"),"image/png")}
 else{try{const r=await fetch(cur.src);deliver(await r.blob(),cur.file)}catch(e){msg.textContent="Could not save. Check your connection and try again."}}};

draw();loadPhotos().then(()=>{if(tab==="photos")draw()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
